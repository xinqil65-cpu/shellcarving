	z-index: 2;
}

::slotted(figcaption){
	-webkit-user-select: text;	
	user-select: text;
	width: 100%;
}

:host([image-fit="fit"]) {
	--object-fit: contain;
}
:host([image-fit="fill"]) {
	--object-fit: cover;
}
:host([image-fit="stretch"]) {
	--object-fit: fill;
}

[part*="media"],
[part*="video"],
[part*="poster"] {
	object-fit: var(--object-fit, cover);
}

[part*="media"]:-webkit-full-screen,
[part*="media"]:fullscreen,
[part*="video"]:-webkit-full-screen,
[part*="video"]:fullscreen {
	object-fit: contain!important;
}

[part*="link"]:focus-visible {
    outline: none;
}

[part*="link"]:-webkit-any-link:focus-visible {
    outline-offset: 0;
}

.placeholder {
	container-type: size;
	container-name: placeholder-media;
}
	
.sizing-frame {
	display: block;
	width: 100%;
	flex-grow: 1;
	height: 0;
	padding-bottom: var(--frame-padding, 72.8515625%);
	position: relative;
}

.frame {
	display:contents;
}

/* for images and custom media */
::slotted([slot="custom-media"]),
[part*="media"] {
	object-position: center center;
	display: block;
	margin: 0;
	width: 100%;
	min-width: 100%;
	min-height: 100%;
	height: 100%;
	position: absolute;
	overflow: clip;
	overflow-clip-margin: content-box;
	inset: 0;
}

[part*="media"]::selection {
	background:transparent;
}

/*
	for URL fileType and default setup for iframe-videos
*/
iframe {
	opacity: 0;
	pointer-events: none;
}

iframe.loaded {
	opacity: 1;
}

/* enable proper padding cropping for videos and non-img/iframe media, in most scenarios */
.div-border-crop {
	all: inherit;
	filter: unset;
	will-change: unset;
	width: unset;
	height: unset;
	padding: 0;
	pointer-events: auto;

	border-left-width: 0px;
	border-right-width: 0px;
	border-top-width: 0px;
	border-bottom-width: 0px;
	top: 0px;
	left: 0px;
	right: 0px;
	bottom: 0px;

	min-width: unset;
	min-height: unset;

	margin: auto;
	border-color: transparent;
	border-style: solid;
	background: transparent;
}

/* for video filetype */
[part*="video"], [part*="poster"] {
	object-position: 50% 50%;	
	display: block;
	margin: 0;
	width: 100%;
	height: 100%;
	position: absolute;
	inset: 0;
}

[part*="video"] iframe[part*="iframe"] {
	opacity: 1;
}

[part*="poster"] {
	object-fit: cover;
	z-index: 2;
	opacity: 0;
}
	
[part*="poster-stopped"]{
	opacity: 1;
}



[part*="media"].image-zoom {
	cursor: var(--copy-page-cursor, var(--image-zoom-cursor, zoom-in));
}	




.sizing-frame {
	isolation: isolate;
}
.noise-mask {
	display: block;
	position: absolute;

	inset: 0;
	pointer-events: none;
	isolation: isolate;
	contain: layout paint;
	/* Transparent border to keep noise off the media-items border */
	border-style: solid;
	border-color: transparent;
	border-width: 0px 0px 0px 0px;

	border-radius: 0px 0px 0px 0px;
	overflow: clip;
}
.noise-layer {
	/*--noise-image: url('https://static.cargo.site/assets/backdrop/video/noise.png');*/
	position: absolute;
	inset: 0;
	pointer-events: none;
	background-repeat: repeat;
	background-size: calc(var(--noise-density-size, 256px) * var(--noise-scale, 1));
	mask-image: var(--media-mask-image);
	mask-mode: alpha;
	mask-size: 100% 100%;
	mask-repeat: no-repeat;
	-webkit-mask-image: var(--media-mask-image);
	-webkit-mask-mode: alpha;
	-webkit-mask-size: 100% 100%;
	-webkit-mask-repeat: no-repeat;
}
.noise-layer-1 {
	/* PROTOTYPE */

	background-image: var(--noise-image), var(--noise-image), var(--noise-image);
	background-position: 0 0;
	mix-blend-mode: normal;
	opacity: calc(var(--noise-images-amount, 0) * 1);
}

:host([disable-noise="true"]) .noise-layer {
	display: none;
}
